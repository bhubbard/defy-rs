[package]
name = "defy-rs"
version = "0.1.0"
edition = "2024"
authors = ["Brandon Hubbard"]
description = "Pure Rust port of police wanted-level, pursuit dispatch, and NPC crime interaction systems from Defy"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bhubbard/defy-rs"

[dependencies]
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

[dev-dependencies]
